name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_to_hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Reports and Web App
        run: |
          npm install
          node report-generator.js

      - name: Inject Complete Enterprise Engine and UI Suite
        run: |
          sed -i 's|</body>|<script src="auto-fix-engine.js"></script><script src="multi-format-exporter.js"></script><script src="ui-bridge.js"></script><script src="footer-injector.js"></script><script src="credit-manager.js"></script></body>|g' index.html

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_A11Y_OMNI }}

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          npx firebase-tools deploy --only hosting --project a11y-omni --non-interactive
