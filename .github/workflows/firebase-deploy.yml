name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  deploy_to_hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Reports and Web App
        run: |
          npm install
          node report-generator.js

      - name: Deploy to Firebase
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_A11Y_OMNI }}
        run: |
          echo "$SA_KEY" > key.json
          npm install -g firebase-tools
          GOOGLE_APPLICATION_CREDENTIALS=key.json npx firebase-tools deploy --only hosting --project a11y-omni --non-interactive
          rm -f key.json
