name: A11yOmni Autonomous Engine

on:
  push:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Website URL to Audit'
        required: true
        default: 'https://resilience-industries.github.io'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  run-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Engine Dependencies & Browsers
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Execute A11yOmni Deep Core Scan
        run: |
          TARGET="${{ github.event.inputs.target_url || 'https://resilience-industries.github.io' }}"
          node engine.js "$TARGET"

      - name: Generate Accessible HTML Dashboard
        run: |
          node report-generator.js

      - name: Commit and Push Reports
        run: |
          git config user.name "A11yOmni Bot"
          git config user.email "bot@a11yomni.local"
          git add audit-report.json index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update Audit JSON and HTML Dashboard" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
